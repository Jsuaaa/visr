[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
hc-proto = { path = "crates/hc-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
alacritty_terminal = "0.26"
term = { path = "crates/term" }
toml = "1.2.1"
