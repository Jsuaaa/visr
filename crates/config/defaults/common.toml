# Visr's defaults. A user config only needs what it changes.

[font]
# Bundled with the app, so it looks the same on every machine.
family = "Lilex Nerd Font Mono"
size = 14
line_height = 18

[theme]
foreground = "#c5c8c6"
background = "#1d1f21"
cursor = "#c5c8c6"
selection = "#373b41"
ansi = [
  "#1d1f21", "#cc6666", "#b5bd68", "#f0c674", "#81a2be", "#b294bb", "#8abeb7", "#c5c8c6",
  "#666666", "#d54e53", "#b9ca4a", "#e7c547", "#7aa6da", "#c397d8", "#70c0b1", "#eaeaea",
]
