name: base branch

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  base:
    name: Validate branch strategy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch flow
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" == "main" && "$HEAD" != "dev" ]]; then
            echo "::error::Pull requests into main must come from dev."
            exit 1
          fi

          if [[ "$BASE" == "dev" && "$HEAD" == "main" ]]; then
            echo "::error::Pull requests from main into dev are not allowed."
            exit 1
          fi
