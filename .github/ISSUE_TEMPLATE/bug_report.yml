name: Bug report
description: Something in Visr does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Visr version
      description: Found in the downloaded release. For example, 0.1.0 from visr-v0.1.0-macos-universal.dmg.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
